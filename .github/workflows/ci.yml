name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t churn-api .
      - name: Start container and check health
        run: |
          docker run -d -p 8080:8000 --name api churn-api
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health && break; sleep 3; done
          curl -f http://localhost:8080/health
      - name: Show container logs
        if: always()
        run: docker logs api